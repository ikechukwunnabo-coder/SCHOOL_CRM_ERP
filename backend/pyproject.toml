[project]
name = "school-erp-backend"
version = "0.1.0"
description = "School CRM & ERP Platform backend (Django/DRF)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.15,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.11,<1.0",
    "django-filter>=24.3",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",
    "django-redis>=5.4",
    "redis>=5.0",
    "celery[redis]>=5.4,<6.0",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "Pillow>=11.0",
    "qrcode[pil]>=7.4",
    "reportlab>=4.2",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "argon2-cffi>=23.1",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "hypothesis>=6.112",
    "coverage[toml]>=7.6",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-q"

[tool.coverage.run]
source = ["apps", "config"]
branch = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
